# Full GOOP pixel-production preset for the complete test_00_00_02 dataset.
#
# Use with the 4-way Slurm launcher:
#   sbatch production/slurm_test_00_00_02_4a100.sbatch
#
# The launcher overrides `--data`, `--events`, `--events-per-file`, and
# `--file-index-offset` per source file shard.

run:
  start_event: 0
  events: 200
  events_per_file: 200
  label_key: interaction
  label_dist: All
  seed: 42
  align: false

detector:
  config: jaxtpc/config/cubic_wireplane_config.yaml
  total_pad: 900000
  response_chunk_size: 9000

output:
  dataset: test_00_00_02_pixel
  outdir: /sdf/data/neutrino/doraemon/optical_test_00_00_02/
  file_index_offset: 0
  overwrite: false
  skip_existing: false
  workers: 2

digitization:
  enabled: true
  n_bits: 15
  pedestal: null
  max_pe_per_pmt: 90000

optical:
  device: cuda
  tick_ns: 1.0
  oversample: 10
  voxel_dx: 25.0
  time_window_ns: null
  ser_jitter_std: 0.1
  baseline_noise_std: 0.0
  kernel_duration_ns: 5000

sampler:
  type: lut
  plib_path: /sdf/data/neutrino/youngsam/compressed_plib_b05_quantile_log_prod_lite_n50.h5
  pmt_qe: 0.12
  n_simulated: 30000000
  lazy: false
  interpolate: true
  device: cuda:0

delays:
  enabled: true
  chain:
    - type: ScintillationBiexponentialDelay
      singlet_fraction: 0.3
      tau_singlet_ns: 6.0
      tau_triplet_ns: 1300.0
    - type: TPBTriexponentialDelay
    - type: TTSDelay
      fwhm_ns: 2.4
      apply_transit_time: true

aux_photon_sources: []
