name: goop
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - "numpy<2"
  - scipy
  - h5py
  - pyyaml
  - matplotlib
  - tqdm
  - pytest
  - pytorch=2.5.1  # the version chroma-lar pins
  - pytorch-cuda=12.1
  - pip:
      - "jax[cuda12]"
      - hdf5plugin  # blosc filter used by jaxtpc step files
      # the chroma sampler: chroma-lar's detectors and the TriChroma it pins (youngsm/trichroma@fcae69c)
      - "chroma-lar @ git+https://github.com/youngsm/chroma-lar.git@177b89d"
